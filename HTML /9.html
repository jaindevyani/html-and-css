<!DOCTYPE html>
<html>
    <head>
        <title> div creation </title>
        <style>
 .red-box{
    background-color:red;
    width:200px;
    height:200px;
    margin-bottom: 10px;
 }

 .green-circle {
    background-color: green;
    width: 200px;
    height: 200px;
    border-radius: 100px;
    margin-bottom: 10px;
 }

 .para-one{
    border-color: black;
    border-style: solid;
    border-width: 0.4px;
    padding: 15px;
    margin-bottom: 10px;
 }

 .para-2{
    border-color: black;
    border-style: solid;
    border-width:2px;
    background-color:  rgb(101, 105, 107);
    padding: 10px;
    
 }

 .youtube{
    font-weight: bold;
    font-size: 25px;
 }

 .yes-button:hover{
background-color: green;
color: white;
 }

 .no-button:hover {
    background-color: red;
    color: white;
 }
</style>
    </head>
    <body>
        <div class= "red-box">
        </div>
        <div class="green-circle">
        </div>
        <div class="para-one">
            <p> Satisfied with our service?</p>
            <button class="yes-button"> Yes </button>
            <button class="no-button"> No </button>
        </div>
        <div class="para-2">

            <p class= "youtube">
                Install Youtube Music
            </p>
            <p>
                Add Youtube Music to your desktop for quick and easy access.
            </p>
        </div>
    </body>
</html>
