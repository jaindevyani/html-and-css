<!DOCTYPE html>
<html>
    <head>
        <title> Positioning </title>
    </head>
    <body style="
    padding-bottom:3000px;
    background-color:rgb(235, 216, 216);">
        <div style="
            background-color:grey;
            width:300px;
            height:150px;
            top:40px;
            left:70px;
            position:fixed;
             z-index:100;">
            
        <div style="
        position:absolute;
        background-color:black;
        color:white;
        right:-6px;
        top:-8px;
        padding:10px;
        border-radius:20px;
        height:10px;
        padding-top:8px;
        width:10px;
        padding-bottom:14px;
        ">&#215</div>
    
    <div style="
    background-color:black;
    color:white;
    width:35px;
    height:20px;
    position:absolute;
    padding-top:5px;
    padding-left:5px;
    bottom:3px;
    right:3px;
    "> 0:29</div>
    
    
    </div>


    <div style="
    position:relative;
    display:inline-block;
    margin-top:400px;
    margin-left:50px;">


    <img style="
    height:300px;
    width:200px;
    border-style:solid;
    border-width:30px;
    border-color:rgb(222, 213, 213);"
    
     src="https://img201.savana.com/goods-pic/bb9d8a6479da4291a2148cdbff6227c0_w540_h720_q85.webp">


<div style="
    background-color:black;
    color:white;
    width:70px;
    height:20px;
    position:absolute;
    padding-top:5px;
    padding-left:5px;

  <div style="
  position:absolute;

</html>
